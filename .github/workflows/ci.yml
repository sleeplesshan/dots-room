name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run assets:prepare && npm run assets:check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run docs:check
      - run: npm run public:check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: pip install -r requirements.txt
      - run: python3 tools/assets/prepare.py
      - run: apps/android/gradlew -p apps/android :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:assembleRelease
